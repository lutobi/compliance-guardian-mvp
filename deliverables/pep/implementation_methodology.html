<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Implementation Methodology — TiN STS Migration & Installation (Electrical + Comms)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 0; padding: 16px; background:#f8fafc; }
    .container { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:0; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .toolbar { display:flex; gap:8px; margin-bottom:10px; }
    .btn { background:#111827; color:#fff; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:600; }
    h1 { margin: 0 0 8px; }

    /* A3 landscape print */
    @page { size: A3 landscape; margin: 10mm; }
    @media print { body { padding:0; background:#fff; } .container { box-shadow:none; border:0; padding:0; } }

    /* Flowchart styling */
    .fc-bg { fill:#ffffff; }
    .fc-rect { fill:#fff; stroke:#111827; stroke-width:2.5; rx:18; ry:18; }
    .fc-diamond { fill:#fff; stroke:#111827; stroke-width:2.5; }
    .fc-text { font: 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#111827; }
    .fc-small { font: 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#111827; }
    .fc-edge { stroke:#111827; stroke-width:2.5; fill:none; }
  </style>
  <script>
    function doPrint(){ window.print(); }
  </script>
</head>
<body>
  <div class="container">

    <svg width="100%" viewBox="0 0 2600 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Implementation Methodology Flowchart">
      <defs>
        <marker id="fc-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="strokeWidth">
          <path d="M 0 0 L 12 6 L 0 12 z" fill="#111827" />
        </marker>
      </defs>

      <!-- Grid (centers):
           Rows Y: r1=190 (top ~120), r2=500 (top ~430), r3=810 (top ~740), r4=1120 (top ~1050)
           Cols X: c1=330, c2=700, c3=1110, c4=1640, c5=2000, c6=2410
           Proc box: 420x140; Diamonds: left/right = ±80, top/bot = ±70 from center -->

      <!-- Assessment (c1,r1) -->
      <rect class="fc-rect" x="120" y="120" width="420" height="140" />
      <text class="fc-text" x="330" y="200" text-anchor="middle">Assessment</text>

      <!-- Decision: Backup Needed? (c2,r1) -->
      <polygon class="fc-diamond" points="620,120 700,190 620,260 540,190" />
      <text class="fc-text" x="620" y="198" text-anchor="middle">Is Backup Needed?</text>

      <!-- Backup (c3,r1) -->
      <rect class="fc-rect" x="900" y="120" width="420" height="140" />
      <text class="fc-text" x="1110" y="200" text-anchor="middle">Backup</text>

      <!-- Replacement / Install (c4,r1) -->
      <rect class="fc-rect" x="1420" y="120" width="440" height="140" />
      <text class="fc-text" x="1640" y="200" text-anchor="middle">Replacement (Decom/Install)</text>

      <!-- Decision: Config Required? (c5,r1) -->
      <polygon class="fc-diamond" points="1920,120 2000,190 1920,260 1840,190" />
      <text class="fc-text" x="1920" y="198" text-anchor="middle">Is Configuration Required?</text>

      <!-- Configuration (c6,r1) -->
      <rect class="fc-rect" x="2160" y="120" width="420" height="140" />
      <text class="fc-text" x="2370" y="200" text-anchor="middle">Configuration</text>

      <!-- Integration (c3,r2) -->
      <rect class="fc-rect" x="900" y="430" width="420" height="140" />
      <text class="fc-text" x="1110" y="510" text-anchor="middle">Integration</text>

      <!-- Testing (c4,r2) -->
      <rect class="fc-rect" x="1420" y="430" width="420" height="140" />
      <text class="fc-text" x="1630" y="510" text-anchor="middle">Testing</text>

      <!-- Decision: Pass Tests? (between c4-c5,r2) -->
      <polygon class="fc-diamond" points="1920,430 2000,500 1920,570 1840,500" />
      <text class="fc-text" x="1920" y="508" text-anchor="middle">Pass Tests?</text>

      <!-- Re-evaluate / Fix (between c3-c4,r3) -->
      <rect class="fc-rect" x="1500" y="740" width="460" height="140" />
      <text class="fc-text" x="1730" y="820" text-anchor="middle">Re-evaluate / Fix</text>

      <!-- Commissioning (c2,r4) -->
      <rect class="fc-rect" x="530" y="1050" width="460" height="140" />
      <text class="fc-text" x="760" y="1130" text-anchor="middle">Commissioning</text>

      <!-- Handover (c3,r4) -->
      <rect class="fc-rect" x="1100" y="1050" width="460" height="140" />
      <text class="fc-text" x="1330" y="1130" text-anchor="middle">Handover</text>

      <!-- Connectors -->
      <!-- Assessment -> Backup decision (gap then into diamond) -->
      <path class="fc-edge" d="M 530 190 H 540" marker-end="url(#fc-arrow)" />
      <!-- Decision YES -> Backup -->
      <path class="fc-edge" d="M 700 190 H 900" marker-end="url(#fc-arrow)" />
      <text class="fc-small" x="800" y="175" text-anchor="middle">YES</text>
      <!-- Decision NO -> Replacement (top loop, ample clearance) -->
      <path class="fc-edge" d="M 620 120 V 60 H 1640 V 120" marker-end="url(#fc-arrow)" />
      <text class="fc-small" x="1130" y="52" text-anchor="middle">NO</text>
      <!-- Backup -> Replacement -->
      <path class="fc-edge" d="M 1320 190 H 1420" marker-end="url(#fc-arrow)" />
      <!-- Replacement -> Config decision -->
      <path class="fc-edge" d="M 1860 190 H 1840" marker-end="url(#fc-arrow)" />
      <!-- Config YES -> Configuration -->
      <path class="fc-edge" d="M 2000 190 H 2200" marker-end="url(#fc-arrow)" />
      <text class="fc-small" x="2100" y="175" text-anchor="middle">YES</text>
      <!-- Config NO -> Integration (down) -->
      <path class="fc-edge" d="M 1920 260 V 400 H 1110 V 430" marker-end="url(#fc-arrow)" />
      <text class="fc-small" x="1820" y="380" text-anchor="middle">NO</text>
      <!-- Configuration -> Integration (down-left, wide) -->
      <path class="fc-edge" d="M 2370 260 V 400 H 1110 V 430" marker-end="url(#fc-arrow)" />
      <!-- Integration -> Testing -->
      <path class="fc-edge" d="M 1320 500 H 1420" marker-end="url(#fc-arrow)" />
      <!-- Testing -> Pass Tests? (ensure non-zero length) -->
      <path class="fc-edge" d="M 1820 500 H 1840" marker-end="url(#fc-arrow)" />
      <!-- Pass Tests? NO -> Re-evaluate -->
      <path class="fc-edge" d="M 1920 570 V 740" marker-end="url(#fc-arrow)" />
      <text class="fc-small" x="1930" y="660" text-anchor="start">NO</text>
      <!-- Re-evaluate -> back to Integration (up-left, roomy) -->
      <path class="fc-edge" d="M 1500 810 H 1110 V 570" marker-end="url(#fc-arrow)" />
      <!-- Pass Tests? YES -> Commissioning (down-left long, ample clearance) -->
      <path class="fc-edge" d="M 2000 500 H 2200 V 1030 H 760 V 1050" marker-end="url(#fc-arrow)" />
      <text class="fc-small" x="2100" y="485" text-anchor="middle">YES</text>
      <!-- Commissioning -> Handover -->
      <path class="fc-edge" d="M 990 1120 H 1100" marker-end="url(#fc-arrow)" />
      <!-- Handover -> Assessment (lifecycle loop, wide) -->
      <path class="fc-edge" d="M 1330 1190 V 1320 H 330 V 260" marker-end="url(#fc-arrow)" />
    </svg>
  </div>
</body>
</html>
