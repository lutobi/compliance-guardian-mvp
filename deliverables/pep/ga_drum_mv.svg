<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1450" role="img" aria-label="GA drawing MV Drum detailed">
  <title>GA — MV Cable Drum (single cable)</title>
  <style>
    .dim { fill:#111827; font-size:14px; }
    .label { fill:#111827; font-size:16px; font-weight:600; }
    .callout { fill:#374151; font-size:13px; }
    .line { stroke:#111827; stroke-width:2; fill:none; }
    .dash { stroke:#9ca3af; stroke-width:2; stroke-dasharray:6 6; fill:none; }
  </style>
  <!-- SIDE (ELEVATION) VIEW -->
  <text class="label" x="520" y="120">Side (Elevation) View</text>
  <!-- Flange and barrel -->
  <circle cx="520" cy="720" r="800" fill="#f3f4f6" stroke="#111827" stroke-width="3" />
  <circle cx="520" cy="720" r="600" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <circle cx="520" cy="720" r="300" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2" />
  <!-- Bore -->
  <circle cx="520" cy="720" r="60" fill="#9ca3af" stroke="#111827" stroke-width="2" />
  <text class="callout" x="600" y="730">Bore Ø ≈ 120 mm (to suit spindle)</text>
  <!-- Flange Ø dimension -->
  <line class="line" x1="520" y1="-40" x2="520" y2="160" />
  <line class="line" x1="490" y1="-40" x2="550" y2="-40" />
  <line class="line" x1="490" y1="160" x2="550" y2="160" />
  <text class="dim" x="540" y="60" transform="rotate(90 540,60)">Flange Ø = 1600 mm (≥ Barrel + 6×OD)</text>
  <!-- Barrel Ø dimension -->
  <line class="line" x1="520" y1="420" x2="520" y2="720" />
  <line class="line" x1="490" y1="420" x2="550" y2="420" />
  <line class="line" x1="490" y1="720" x2="550" y2="720" />
  <text class="dim" x="540" y="580" transform="rotate(90 540,580)">Barrel Ø = 1200 mm (≥ 18×OD)</text>
  <!-- Exit path and clamp/guide with bend radius -->
  <path d="M 520 100 C 520 100, 820 140, 950 260" fill="none" stroke="#ef4444" stroke-width="4" />
  <rect x="950" y="260" width="160" height="22" fill="#9ca3af" />
  <text class="callout" x="1120" y="275">Lead clamp/guide bar; payout path R ≥ 12×OD (≥ 780 mm)</text>

  <!-- FRONT (WIDTH) VIEW with edge clearances and traverse pitch) -->
  <text class="label" x="1420" y="120">Front (Width) View</text>
  <rect x="1120" y="240" width="920" height="760" fill="#f9fafb" stroke="#111827" stroke-width="3" />
  <rect x="1140" y="260" width="880" height="720" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <!-- Edge clearances zones (≥ 130 mm) -->
  <rect x="1140" y="260" width="130" height="720" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 6" />
  <rect x="1890" y="260" width="130" height="720" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 6" />
  <text class="dim" x="1205" y="1000">≥ 130 mm</text>
  <text class="dim" x="1955" y="1000">≥ 130 mm</text>
  <!-- Traverse pitch rulers (≈ 68 mm) across the fill area -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="1270" y1="260" x2="1270" y2="980" />
    <line x1="1338" y1="260" x2="1338" y2="980" />
    <line x1="1406" y1="260" x2="1406" y2="980" />
    <line x1="1474" y1="260" x2="1474" y2="980" />
    <line x1="1542" y1="260" x2="1542" y2="980" />
    <line x1="1610" y1="260" x2="1610" y2="980" />
    <line x1="1678" y1="260" x2="1678" y2="980" />
    <line x1="1746" y1="260" x2="1746" y2="980" />
  </g>
  <text class="callout" x="1440" y="1020">Traverse pitch ≈ 68 mm (≈ 1.05×OD)</text>

  <!-- Width dimension (set during procurement) -->
  <line class="line" x1="1140" y1="1020" x2="2020" y2="1020" />
  <line class="line" x1="1140" y1="990" x2="1140" y2="1020" />
  <line class="line" x1="2020" y1="990" x2="2020" y2="1020" />
  <text class="dim" x="1580" y="1050">Drum width W: set per ordered length and lay (typ. 900–1400 mm)</text>

  <!-- Cable OD reference -->
  <rect x="160" y="1180" width="220" height="44" fill="#111827" />
  <text class="label" x="270" y="1210" text-anchor="middle" fill="#fff">Cable OD ≈ 65 mm</text>
</svg>
