<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TiN Electrical and Communications Activities for STS Migration & Installation — Gantt (A3)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 0; padding: 16px; background:#f8fafc; }
    .container { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .toolbar { display:flex; gap:8px; margin-bottom:10px; }
    .btn { background:#111827; color:#fff; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:600; }
    .note { color:#374151; margin:8px 0 16px; }
    @page { size: A3 landscape; margin: 10mm; }
    @media print { body { padding:0; background:#fff; } .container { box-shadow:none; border:0; } }
  </style>
  <script>function doPrint(){ window.print(); }</script>
</head>
<body>
  <h1>TiN Electrical and Communications Activities for STS Migration & Installation</h1>
  <div class="container">
    <div class="toolbar">
      <button class="btn" onclick="doPrint()">Print (A3 Landscape)</button>
    </div>

    <svg width="100%" viewBox="0 0 2450 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="14-week activity-row Gantt">
      <defs>
        <style>
          .axis { stroke: #9ca3af; stroke-width: 1; }
          .grid { stroke: #e5e7eb; stroke-width: 1; }
          .lbl { font: 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #111827; }
          .lbl-small { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #111827; }
          .muted { fill:#374151; }
          .bar { paint-order: stroke; stroke-width: 1; }
        </style>
      </defs>

      <!-- Layout constants: rowHeight=48, rowGap=18, startX=420 -->
      <g transform="translate(420,120)">
        <text class="lbl" x="-320" y="-40">14‑Week Plan — Integrated Activities</text>

        <!-- Week grid (140px/week) across 14 weeks) -->
        <g>
          <line class="grid" x1="0" y1="0" x2="0" y2="1080" />
          <line class="grid" x1="140" y1="0" x2="140" y2="1080" />
          <line class="grid" x1="280" y1="0" x2="280" y2="1080" />
          <line class="grid" x1="420" y1="0" x2="420" y2="1080" />
          <line class="grid" x1="560" y1="0" x2="560" y2="1080" />
          <line class="grid" x1="700" y1="0" x2="700" y2="1080" />
          <line class="grid" x1="840" y1="0" x2="840" y2="1080" />
          <line class="grid" x1="980" y1="0" x2="980" y2="1080" />
          <line class="grid" x1="1120" y1="0" x2="1120" y2="1080" />
          <line class="grid" x1="1260" y1="0" x2="1260" y2="1080" />
          <line class="grid" x1="1400" y1="0" x2="1400" y2="1080" />
          <line class="grid" x1="1540" y1="0" x2="1540" y2="1080" />
          <line class="grid" x1="1680" y1="0" x2="1680" y2="1080" />
          <line class="grid" x1="1820" y1="0" x2="1820" y2="1080" />
          <line class="grid" x1="1960" y1="0" x2="1960" y2="1080" />
        </g>
        <g>
          <text class="lbl-small muted" x="0" y="-8">W1</text>
          <text class="lbl-small muted" x="140" y="-8">W2</text>
          <text class="lbl-small muted" x="280" y="-8">W3</text>
          <text class="lbl-small muted" x="420" y="-8">W4</text>
          <text class="lbl-small muted" x="560" y="-8">W5</text>
          <text class="lbl-small muted" x="700" y="-8">W6</text>
          <text class="lbl-small muted" x="840" y="-8">W7</text>
          <text class="lbl-small muted" x="980" y="-8">W8</text>
          <text class="lbl-small muted" x="1120" y="-8">W9</text>
          <text class="lbl-small muted" x="1260" y="-8">W10</text>
          <text class="lbl-small muted" x="1400" y="-8">W11</text>
          <text class="lbl-small muted" x="1540" y="-8">W12</text>
          <text class="lbl-small muted" x="1680" y="-8">W13</text>
          <text class="lbl-small muted" x="1820" y="-8">W14</text>
          <line class="axis" x1="0" y1="0" x2="1960" y2="0" />
          <line class="axis" x1="0" y1="1080" x2="1960" y2="1080" />
        </g>

        <!-- Left-side activity labels -->
        <g id="labels" transform="translate(-340,0)">
          <text class="lbl" x="0" y="34">Kickoff Meeting</text>
          <text class="lbl" x="0" y="100">Site Access & HSE</text>
          <text class="lbl" x="0" y="166">Engineering Design</text>
          <text class="lbl" x="0" y="232">IDC/IDR & Revisions</text>
          <text class="lbl" x="0" y="298">Technical Spec & Vendor Selection</text>
          <text class="lbl" x="0" y="364">Long‑lead POs & Expediting</text>
          <text class="lbl" x="0" y="430">FAT</text>
          <text class="lbl" x="0" y="496">Logistics & Customs</text>
          <text class="lbl" x="0" y="562">Equipment Delivery</text>
          <text class="lbl" x="0" y="628">Site Preparation</text>
          <text class="lbl" x="0" y="694">Cable Termination & Integration</text>
          <text class="lbl" x="0" y="760">Duct/Chamber Checks (Comms)</text>
          <text class="lbl" x="0" y="826">FO Pull & Splice</text>
          <text class="lbl" x="0" y="892">Pre‑commissioning, Commissioning & Loop Testing</text>
          <text class="lbl" x="0" y="958">SAT</text>
          <text class="lbl" x="0" y="1024">System Energization & Testing</text>
          <text class="lbl" x="0" y="1090">Training & Handover</text>
        </g>

        <!-- Bars: each row gets a single, clear bar (no duplicates) -->
        <!-- y for row n = 10 + (n-1)*66; height=28 -->
        
        <!-- 1 Kickoff Meeting -->
        <rect class="bar" x="0" y="10" width="80" height="28" rx="5" fill="#2563eb" stroke="#1e40af" />
        
        <!-- 2 Site Access & HSE -->
        <rect class="bar" x="0" y="76" width="280" height="28" rx="5" fill="#0ea5e9" stroke="#0369a1" />
        
        <!-- 3 Engineering Design -->
        <rect class="bar" x="140" y="142" width="350" height="28" rx="5" fill="#16a34a" stroke="#166534" />
        
        <!-- 4 IDC/IDR & Revisions -->
        <rect class="bar" x="490" y="208" width="210" height="28" rx="5" fill="#f59e0b" stroke="#b45309" />
        
        <!-- 5 Technical Spec & Vendor Selection -->
        <rect class="bar" x="280" y="274" width="420" height="28" rx="5" fill="#8b5cf6" stroke="#6d28d9" />
        
        <!-- 6 Long‑lead POs & Expediting -->
        <rect class="bar" x="700" y="340" width="350" height="28" rx="5" fill="#06b6d4" stroke="#0e7490" />
        
        <!-- 7 FAT -->
        <rect class="bar" x="840" y="406" width="140" height="28" rx="5" fill="#eab308" stroke="#a16207" />
        
        <!-- 8 Logistics & Customs -->
        <rect class="bar" x="980" y="472" width="220" height="28" rx="5" fill="#f59e0b" stroke="#b45309" />
        
        <!-- 9 Equipment Delivery -->
        <rect class="bar" x="1120" y="538" width="200" height="28" rx="5" fill="#84cc16" stroke="#4d7c0f" />
        
        <!-- 10 Site Preparation -->
        <rect class="bar" x="1120" y="604" width="160" height="28" rx="5" fill="#9ca3af" stroke="#6b7280" />
        
        <!-- 11 Cable Termination & Integration -->
        <rect class="bar" x="1280" y="670" width="320" height="28" rx="5" fill="#ef4444" stroke="#991b1b" />
        
        <!-- 12 Duct/Chamber Checks (Comms) -->
        <rect class="bar" x="1120" y="736" width="160" height="28" rx="5" fill="#22c55e" stroke="#15803d" />
        
        <!-- 13 FO Pull & Splice -->
        <rect class="bar" x="1280" y="802" width="240" height="28" rx="5" fill="#0ea5e9" stroke="#0369a1" />
        
        <!-- 14 Pre‑commissioning, Commissioning & Loop Testing (2w W11–W12) -->
        <rect class="bar" x="1400" y="868" width="280" height="28" rx="5" fill="#f97316" stroke="#c2410c" />
        
        <!-- 15 SAT (1w W13) -->
        <rect class="bar" x="1680" y="934" width="140" height="28" rx="5" fill="#14b8a6" stroke="#0f766e" />
        
        <!-- 16 System Energization & Testing (window early W14) -->
        <rect class="bar" x="1820" y="1000" width="40" height="28" rx="5" fill="#dc2626" stroke="#7f1d1d" />
        
        <!-- 17 Training & Handover (1w W14) -->
        <rect class="bar" x="1820" y="1066" width="140" height="28" rx="5" fill="#10b981" stroke="#047857" />

        <!-- IFC milestone marker aligned with end of Design -->
        <polygon points="714,108 726,120 714,132 702,120" fill="#111827" />
        <text class="lbl-small muted" x="736" y="126">IFC Issue</text>
      </g>
    </svg>
  </div>
</body>
</html>
